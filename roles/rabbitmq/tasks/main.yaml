- name: copy rabbitmq.repo
  copy:
    src: rabbitmq.repo
    dest: /etc/yum.repos.d/rabbitmq.repo

- name:
  dnf:
    name: 
      - erlang
      - rabbitmq-server
    state: present 

- name: Start and enable rabbitmq
  service:
    name: rabbitmq-server
    state: started
    enabled: yes  

- name: Create RabbitMQ user with permissions
  community.rabbitmq.rabbitmq_user:
    user: "{{ rabbitmq_user }}"
    password: "{{ rabbitmq_password }}"
    tags: monitoring
    permissions:
      - vhost: /
        configure_priv: .*
        read_priv: .*
        write_priv: .*   
        state: present      