- name: enable redi 7
  command: dnf module enable redis:7 -y

- name: install redis
  package:
    name: redis
    state: present

- name: Allow remort connections
  replace:
    path: /etc/redis/redis.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'

- name: desable protected module
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^#?protected-mode yes'
    line: 'protected-mode no'

- name: start and enable mongodb
  service:
    name: redis
    state: restarted
    enabled: yes  