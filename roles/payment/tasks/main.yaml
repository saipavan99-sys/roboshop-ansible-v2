- name: application setup
  include_role: 
    name: common
    tasks_from: app-setup

# calling common role for install nodejs
- name: python setup
  include_role: 
    name: common
    tasks_from: python

# calling common role for systemd-setup
- name: systemd-setup
  include_role: 
    name: common
    tasks_from: systemd-setup

- name: daemon-reload
  include_role: 
    name: common
    tasks_from: daemon-reload

- name: start and enable
  include_role: 
    name: common
    tasks_from: restart