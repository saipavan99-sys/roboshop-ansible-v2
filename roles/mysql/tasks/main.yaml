- name: update root password for localhost
  command: >
    mysql -u root -p'{{ mysql_root_password }}'
    -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password }}';"

- name: update root password for remote connections
  command: >
    mysql -u root -p'{{ mysql_root_password }}'
    -e "ALTER USER 'root'@'%' IDENTIFIED BY '{{ mysql_root_password }}';"

