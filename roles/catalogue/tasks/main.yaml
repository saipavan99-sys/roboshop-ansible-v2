- name: Print variables
  debug:
    msg: "COURSE: {{ course }},DURATION: {{ duration }},LEARNER: {{ learner }}"
# calling common file for app setup
- name: application setup
  include_role: 
    name: common
    tasks_from: app-setup

# calling common role for install nodejs
- name: nodejs setup
  include_role: 
    name: common
    tasks_from: nodejs

# calling common role for systemd-setup
- name: systemd-setup
  include_role: 
    name: common
    tasks_from: systemd-setup


- name: copy mongo repo
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: Install mongo client
  dnf:
    name: mongodb-mongosh
    state: present        

- name: check products loaded or not
  command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: product_count

- name: print product_count
  debug:
    msg: "{{ product_count }}"

# Because of redirection command not work : we use shell module here
# use | for changing output string>int
- name: Load products
  shell: mongosh --host "{{ mongodb_host }}" </app/db/master-data.js   
  when: product_count.stdout | int == 0   

- name: daemon-reload
  include_role: 
    name: common
    tasks_from: daemon-reload

- name: start and enable
  include_role: 
    name: common
    tasks_from: restart